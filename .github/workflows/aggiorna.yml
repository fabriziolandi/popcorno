name: Aggiorna dati Popcorno

# Legge guida TV, cataloghi, film e orari dei cinema e pubblica il sito su Cloudflare Workers.
# I dati generati non vengono salvati nella cronologia del repository: vanno
# direttamente nel sito. Si salvano solo public/data/tv.json e public/data/meta.json (piccoli),
# cosi' se una lettura fallisce resta la guida precedente.

on:
  schedule:
    - cron: "40 6 * * *"    # 07:40 ora italiana (inverno): anche orari dei cinema
    - cron: "10 14 * * *"   # 15:10: guida definitiva della sera
    - cron: "20 17 * * *"   # 18:20: riserva
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aggiorna-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Data di oggi
        id: oggi
        run: echo "d=$(TZ=Europe/Rome date +%F)" >> "$GITHUB_OUTPUT"

      - name: Guida TV di oggi (in chiaro, Sky, sport)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python3 scripts/guida.py

      - name: Pluto TV e Samsung TV Plus
        run: |
          curl -sfL -o /tmp/pluto.xml https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/PlutoTV/it.xml || true
          curl -sfL -o /tmp/samsung.xml https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/SamsungTVPlus/it.xml || true
          python3 scripts/epg.py "${{ steps.oggi.outputs.d }}" /tmp/pluto.xml /tmp/samsung.xml > /tmp/fast.json || echo "[]" > /tmp/fast.json
          python3 - <<'PY'
          import json
          tv = json.load(open("public/data/tv.json"))
          tv = [x for x in tv if x.get("s") not in ("pluto", "samsung")] + json.load(open("/tmp/fast.json"))
          json.dump(tv, open("/tmp/items.json", "w"), ensure_ascii=False)
          PY

      - name: TMDB (piu' visti, novita', cinema, voti) e catalogo completo
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          python3 scripts/tmdb.py /tmp/items.json > /tmp/tmdb.json || echo "{}" > /tmp/tmdb.json
          python3 scripts/catalogo.py public/data/catalogo

      # Orari dei cinema: letti una volta al giorno e tenuti in cache per le altre esecuzioni
      - name: Orari dei cinema (cache del giorno)
        id: cache-cinema
        uses: actions/cache@v4
        with:
          path: public/data/cinema
          key: cinema-${{ steps.oggi.outputs.d }}
          restore-keys: cinema-
      - name: Orari dei cinema (lettura)
        if: steps.cache-cinema.outputs.cache-hit != 'true' && github.event_name != 'push'
        continue-on-error: true
        run: python3 scripts/cinema.py public/data/cinema

      # Se manca un oggi.json valido il job si ferma qui, prima della pubblicazione:
      # resta online la versione precedente.
      - name: Componi public/data/oggi.json
        run: |
          python3 scripts/build.py --json public/data/meta.json /tmp/items.json /tmp/tmdb.json > public/data/oggi.json
          python3 -m json.tool public/data/oggi.json > /dev/null

      # Per i telefoni con la versione vecchia dell'app (legge oggi.js).
      # togliere dopo il 2026-12-09 (data del cambio + 30 giorni)
      - name: Componi public/data/oggi.js (versione vecchia)
        run: |
          python3 scripts/build.py public/data/meta.json /tmp/items.json /tmp/tmdb.json > public/data/oggi.js
          node --check public/data/oggi.js

      # Vecchio indirizzo fabriziolandi.github.io/popcorno/: solo la pagina che porta a popcorno.it
      # con le preferenze salvate li'. Pubblicata anche se test o Cloudflare falliscono.
      - name: Pacchetto per GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-redirect

      - name: Salva la guida TV (solo i file piccoli)
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "popcorno-bot"
          git config user.email "popcorno-bot@users.noreply.github.com"
          git add public/data/tv.json public/data/meta.json
          git diff --cached --quiet || git commit -m "Guida TV $(TZ=Europe/Rome date '+%d/%m %H:%M')"
          git pull --rebase origin main && git push

      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Controllo del token prima di pubblicare: stampa solo si/no, mai valori o nomi.
      - name: Controlla il token Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "Lunghezza Account ID: ${#CF_ACCOUNT} (atteso 32)"
          echo "Token valido e attivo: $(api /user/tokens/verify | jq -r '.success and .result.status == "active"')"
          echo "Il token vede l'account indicato: $(api "/accounts/$CF_ACCOUNT" | jq -r '.success')"
          echo "Account visibili al token: $(api '/accounts?per_page=50' | jq -r '.result | length')"
          echo "Il token puo' leggere i Worker dell'account: $(api "/accounts/$CF_ACCOUNT/workers/scripts" | jq -r '.success')"
          echo "Sottodominio workers.dev configurato: $(api "/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.success and (.result.subdomain != null)')"

      - name: Pubblica su Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  pagine:
    # Solo su main: sugli altri rami si pubblica soltanto su Cloudflare.
    if: always() && github.ref == 'refs/heads/main'
    needs: aggiorna
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Pubblica il sito
        id: deploy
        uses: actions/deploy-pages@v4
