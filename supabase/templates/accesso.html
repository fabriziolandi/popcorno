<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entra in Popcorno</title></head>
<body style="margin:0;padding:24px 12px;background:#f4f4f8;font-family:Arial,Helvetica,sans-serif;color:#151a44;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;">
    <tr><td style="padding:32px 28px;text-align:center;">
      <h1 style="margin:0 0 24px;font-size:24px;color:#151a44;">Entra in Popcorno</h1>
      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:14px 36px;background:#ffb547;color:#151a44;font-weight:bold;font-size:16px;text-decoration:none;border-radius:999px;">Entra</a>
      <p style="margin:28px 0 0;font-size:15px;line-height:1.5;color:#151a44;">Oppure scrivi questo codice nell'app: <strong style="font-size:20px;letter-spacing:2px;">{{ .Token }}</strong></p>
      <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#5a5f85;">Se non hai chiesto tu l'accesso, ignora questa email.</p>
    </td></tr>
  </table>
</body>
</html>
